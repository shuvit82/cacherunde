name: Web-Version veröffentlichen

on:
  push:
    branches: [main]
    paths: ["www/**", ".github/workflows/pages.yml", "scripts/vendor-libs.mjs"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kartenbibliotheken in die Web-Version kopieren
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts leaflet@1.9.4 protomaps-leaflet@5.1.0
          node scripts/vendor-libs.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
