name: Android-App bauen

on:
  # Nur auf Anforderung bauen (Actions → "Android-App bauen" → "Run workflow"),
  # nicht bei jedem Push.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Capacitor-Kern in die App kopieren
        run: |
          node -e '
            const fs=require("fs"),path=require("path");
            const dir=path.dirname(require.resolve("@capacitor/core/package.json"));
            const pkg=require(path.join(dir,"package.json"));
            const candidates=[pkg.unpkg,pkg.jsdelivr,"dist/capacitor.js"].filter(Boolean);
            const src=candidates.map(f=>path.join(dir,f)).find(f=>fs.existsSync(f));
            if(!src){console.error("Capacitor-Kern nicht gefunden:",candidates);console.error(fs.readdirSync(path.join(dir,"dist")));process.exit(1);}
            fs.copyFileSync(src,"www/capacitor.js");
            console.log("Kopiert:",path.relative(process.cwd(),src),"→ www/capacitor.js ("+pkg.version+")");
          '

      - name: Signierschlüssel bereitstellen
        env:
          CR_KEYSTORE_B64: ${{ secrets.CR_KEYSTORE_B64 }}
        run: |
          if [ -n "$CR_KEYSTORE_B64" ]; then
            echo "$CR_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cacherunde.jks"
            echo "CR_KEYSTORE_FILE=$RUNNER_TEMP/cacherunde.jks" >> "$GITHUB_ENV"
            echo "Eigener Signierschlüssel gefunden."
          else
            echo "Kein Signierschlüssel hinterlegt – Debug-Build."
          fi

      - name: Build-Info in die App schreiben
        run: |
          node -e '
            const fs=require("fs");
            const v=require("./package.json").version;
            const info={version:v,build:+process.env.GITHUB_RUN_NUMBER,commit:process.env.GITHUB_SHA.slice(0,7),date:new Date().toISOString()};
            fs.writeFileSync("www/build-info.json",JSON.stringify(info));
            console.log("Build-Info:",JSON.stringify(info));
          '

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: APK bauen
        env:
          CR_KEYSTORE_PASSWORD: ${{ secrets.CR_KEYSTORE_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$CR_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/CacheRunde.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/CacheRunde.apk"
          fi

      - name: APK als Build-Ergebnis speichern
        uses: actions/upload-artifact@v4
        with:
          name: CacheRunde-apk
          path: ${{ runner.temp }}/CacheRunde.apk

      - name: APK zum Herunterladen veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD=${GITHUB_RUN_NUMBER}
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NOTES="CacheRunde $VERSION – Build $BUILD vom ${DATE%%T*} (Commit ${GITHUB_SHA::7}). Auf dem Handy herunterladen und installieren."
          write_version() {
            node -e '
              const [,version,build,commit,date,apk,out]=process.argv;
              require("fs").writeFileSync(out,JSON.stringify({version,build:+build,commit,date,apk}));
            ' "$VERSION" "$BUILD" "${GITHUB_SHA::7}" "$DATE" "$1" "$RUNNER_TEMP/version.json"
          }

          # 1) Release im Code-Repository (funktioniert ohne Login nur, solange es öffentlich ist)
          write_version "https://github.com/${GITHUB_REPOSITORY}/releases/download/android-latest/CacheRunde.apk"
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest "$RUNNER_TEMP/CacheRunde.apk" "$RUNNER_TEMP/version.json" \
            --title "CacheRunde Android $VERSION (Build $BUILD)" \
            --notes "$NOTES" --prerelease --target "$GITHUB_SHA"

          # 2) Optional: öffentliches Release-Repository (für einen privaten Code-Stand)
          if [ -n "$RELEASES_TOKEN" ]; then
            PUB="${GITHUB_REPOSITORY_OWNER}/cacherunde-releases"
            TAG="v${VERSION}-b${BUILD}"
            write_version "https://github.com/${PUB}/releases/download/${TAG}/CacheRunde.apk"
            GH_TOKEN="$RELEASES_TOKEN" gh release create "$TAG" "$RUNNER_TEMP/CacheRunde.apk" "$RUNNER_TEMP/version.json" \
              -R "$PUB" --title "CacheRunde $VERSION (Build $BUILD)" --notes "$NOTES" --latest
            # nur die letzten 5 Versionen aufheben
            GH_TOKEN="$RELEASES_TOKEN" gh release list -R "$PUB" --limit 100 --json tagName -q '.[5:][].tagName' | while read -r t; do
              GH_TOKEN="$RELEASES_TOKEN" gh release delete "$t" -R "$PUB" --yes --cleanup-tag || true
            done
            echo "Auch in ${PUB} veröffentlicht."
          else
            echo "Kein RELEASES_TOKEN – nur im Code-Repository veröffentlicht."
          fi
