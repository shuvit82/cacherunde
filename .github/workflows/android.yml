name: Android-App bauen

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "resources/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Signierschlüssel bereitstellen
        env:
          CR_KEYSTORE_B64: ${{ secrets.CR_KEYSTORE_B64 }}
        run: |
          if [ -n "$CR_KEYSTORE_B64" ]; then
            echo "$CR_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cacherunde.jks"
            echo "CR_KEYSTORE_FILE=$RUNNER_TEMP/cacherunde.jks" >> "$GITHUB_ENV"
            echo "Eigener Signierschlüssel gefunden."
          else
            echo "Kein Signierschlüssel hinterlegt – Debug-Build."
          fi

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: APK bauen
        env:
          CR_KEYSTORE_PASSWORD: ${{ secrets.CR_KEYSTORE_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$CR_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/CacheRunde.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/CacheRunde.apk"
          fi

      - name: APK als Build-Ergebnis speichern
        uses: actions/upload-artifact@v4
        with:
          name: CacheRunde-apk
          path: ${{ runner.temp }}/CacheRunde.apk

      - name: APK zum Herunterladen veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NOTES="CacheRunde $VERSION – Build ${GITHUB_RUN_NUMBER} vom $(date -u +%Y-%m-%d) (Commit ${GITHUB_SHA::7}). Auf dem Handy herunterladen und installieren."
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest "$RUNNER_TEMP/CacheRunde.apk" \
            --title "CacheRunde Android $VERSION (Build ${GITHUB_RUN_NUMBER})" \
            --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
